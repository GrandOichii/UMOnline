[package]
name = "um_parser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.4.3", features = ["experimental-godot-api"]}
rusqlite = { version = "0.37.0", features = ["bundled"] }
mlua = { version = "0.11.4", features=["lua54", "vendored"]}
regex = "1.11.3"
sql_query_builder = { version = "2.x.x", features = ["postgresql"] }
chrono = "0.4.42"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
stylua = "2.3.1"

services:
  db:
    container_name: um-db
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - um-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
  server:
    build: .
    ports:
      - 5000:5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Production    
    links:
      - db
    depends_on:
      - db

volumes:
  um-db-data: